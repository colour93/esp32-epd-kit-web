[package]
name = "epd-agent"
version = "0.2.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
base64 = "0.22"
btleplug = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1.4"
dirs = "6.0"
futures = "0.3"
fs4 = "1.1"
jmespath = "0.3"
keyring = { version = "3.6", features = ["apple-native", "crypto-rust", "linux-native-sync-persistent", "windows-native"] }
mime_guess = "2.0"
open = "5.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "json", "rustls-tls", "stream", "zstd"] }
rmp-serde = "1.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
url = "2.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Enumeration", "Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tao = { version = "0.34", default-features = false }
tray-icon = "0.21"

[package.metadata.packager]
product-name = "EPD Agent"
identifier = "dev.epd-kit.agent"
formats = ["app", "dmg", "nsis"]
resources = ["../dist"]

[package.metadata.packager.macos]
info-plist-path = "macos/Info.plist"
