[package]
name = "epd-agent"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
btleplug = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1.4"
dirs = "6.0"
futures = "0.3"
mime_guess = "2.0"
open = "5.3"
rand = "0.9"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Enumeration", "Foundation"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tao = { version = "0.34", default-features = false }
tray-icon = "0.21"

[package.metadata.packager]
product-name = "EPD Agent"
identifier = "dev.epd-kit.agent"
formats = ["app", "dmg", "nsis"]
resources = ["../dist"]

[package.metadata.packager.macos]
info-plist-path = "macos/Info.plist"
